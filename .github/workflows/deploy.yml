name: Deploy Temp Email

# 一键部署：D1 自动建库/迁库 -> 生成 wrangler.toml -> 部署 Worker（含前端静态资源）
#
# 分支约定：
#   main       = 上游镜像（由 Upstream Sync 自动覆盖，禁止放定制提交）
#   cloudflare = 你的定制分支，也是本工作流的部署触发分支
#
# 需要的仓库 Secrets: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
# 可选 Secrets: JWT_SECRET, ADMIN_PASSWORDS, SITE_PASSWORDS
# 可选 Variables: WORKER_NAME, MAIL_DOMAINS, WORKER_ROUTES, D1_DATABASE_NAME, D1_DATABASE_ID, ...

on:
  workflow_dispatch:
    inputs:
      d1_database_name:
        description: "D1 数据库名（不存在则自动创建，已存在则复用）"
        required: false
        default: "cloudflare_temp_email"
      with_frontend:
        description: "是否把前端静态资源一起打进 Worker"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
      run_migration:
        description: "是否执行 D1 迁移"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"
# ⚠️ 部署分支是 cloudflare，不是 main。
# main 由上游的 Upstream Sync 工作流每周自动覆盖成上游版本，任何定制提交放 main 都会被冲掉。
# 分支名刻意叫 cloudflare 而不是 dev —— 上游自己也有一条 dev 分支，同名会混淆甚至被误同步。
  push:
    branches: [cloudflare, cloudflare_admin]
    paths:
      - "worker/**"
      - "frontend/**"
      - "db/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-temp-email
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # ---- 非敏感配置：优先读仓库 Variables，其次读 workflow 输入，最后是内置默认值 ----
      WORKER_NAME: ${{ vars.WORKER_NAME || 'cloudflare-temp-email' }}
      MAIL_DOMAINS: ${{ vars.MAIL_DOMAINS || '["ventiecho.com"]' }}
      DEFAULT_DOMAINS: ${{ vars.DEFAULT_DOMAINS || '' }}
      RANDOM_SUBDOMAIN_DOMAINS: ${{ vars.RANDOM_SUBDOMAIN_DOMAINS || '' }}
      RANDOM_SUBDOMAIN_LENGTH: ${{ vars.RANDOM_SUBDOMAIN_LENGTH || '8' }}
      ADDRESS_PREFIX: ${{ vars.ADDRESS_PREFIX || 'tmp' }}
      WORKER_ROUTES: ${{ vars.WORKER_ROUTES || '["mail.ventiecho.com"]' }}
      WORKER_ROUTE_ZONE: ${{ vars.WORKER_ROUTE_ZONE || 'ventiecho.com' }}
      ENABLE_CREATE_ADDRESS_SUBDOMAIN_MATCH: ${{ vars.ENABLE_CREATE_ADDRESS_SUBDOMAIN_MATCH || 'true' }}
      CLEANUP_CRON: ${{ vars.CLEANUP_CRON || '' }}
      D1_DATABASE_NAME: ${{ inputs.d1_database_name || vars.D1_DATABASE_NAME || 'cloudflare_temp_email' }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || '' }}
      USE_WORKER_ASSETS: ${{ inputs.with_frontend || 'true' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || '' }}
      # ---- 敏感配置 ----
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_PASSWORDS: ${{ secrets.ADMIN_PASSWORDS }}
      SITE_PASSWORDS: ${{ secrets.SITE_PASSWORDS }}
    steps:
      - name: 校验必需 Secrets
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::缺少 Secret: CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::缺少 Secret: CLOUDFLARE_API_TOKEN"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: 安装 Worker 依赖（提供 wrangler）
        run: cd worker && pnpm install --no-frozen-lockfile

      - name: D1 建库 / 复用
        run: bash scripts/d1-setup.sh

      - name: 构建前端静态资源
        if: ${{ env.USE_WORKER_ASSETS == 'true' }}
        run: cd frontend && pnpm install --no-frozen-lockfile && pnpm build:pages

      - name: 生成 wrangler.toml
        run: node scripts/gen-wrangler.mjs

      # 需要 Token 具备 D1 权限；没有也不影响部署，稍后用 Worker 管理端 API 建表
      - name: D1 迁移
        if: ${{ inputs.run_migration != 'false' }}
        continue-on-error: true
        run: bash scripts/d1-migrate.sh

      - name: 部署 Worker
        run: cd worker && pnpm run deploy

      # 通过 Worker 自带的 /admin/db_initialize 建表，不依赖 D1 API 权限，幂等安全
      - name: 初始化数据库（经 Worker 管理端 API）
        continue-on-error: true
        run: |
          DOMAIN="$(node -e 'try{console.log((JSON.parse(process.env.WORKER_ROUTES||"[]"))[0]||"")}catch(e){console.log("")}')"
          PWD0="$(node -e 'try{console.log((JSON.parse(process.env.ADMIN_PASSWORDS||"[]"))[0]||"")}catch(e){console.log("")}')"
          if [ -z "$DOMAIN" ] || [ -z "$PWD0" ]; then
            echo "::warning::跳过数据库初始化：缺少对外域名或管理员密码"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 -X POST "https://${DOMAIN}/admin/db_initialize" \
                 -H "x-admin-auth: ${PWD0}" -H 'Content-Type: application/json'; then
              echo ""
              echo "✅ 数据库已初始化"
              # 幂等地执行版本迁移（如 address.password / raw_mails.metadata 等列）
              curl -fsS --max-time 30 -X POST "https://${DOMAIN}/admin/db_migration" \
                   -H "x-admin-auth: ${PWD0}" -H 'Content-Type: application/json' || true
              exit 0
            fi
            echo "第 $i 次失败，等待 20s（自定义域名的 DNS 可能还没生效）"
            sleep 20
          done
          echo "::warning::自动初始化失败，请到 https://${DOMAIN}/admin 的「快速设置 → 数据库」手动点一次初始化"

      # 收信链路收尾：通配 MX（子域名邮箱的关键）+ Catch-all -> Worker
      # continue-on-error：Token 没有 Email Routing 权限时只告警，绝不拖垮部署
      - name: 配置 Email Routing（通配 MX + Catch-all）
        if: ${{ vars.SKIP_EMAIL_ROUTING != 'true' }}
        continue-on-error: true
        run: python3 scripts/setup_email_routing.py

      - name: 部署摘要
        run: |
          DOMAIN="$(node -e 'try{console.log((JSON.parse(process.env.WORKER_ROUTES||"[]"))[0]||"")}catch(e){console.log("")}')"
          {
            echo "## 部署完成"
            echo ""
            echo "- Worker: \`${WORKER_NAME}\`"
            echo "- 对外域名: https://${DOMAIN}"
            echo "- 收信域名: ${MAIL_DOMAINS}"
            echo "- D1: \`${D1_DATABASE_NAME}\`"
            echo ""
            echo "若上方「配置 Email Routing」出现 warning，说明 Cloudflare 侧的收信链路"
            echo "还需在控制台点一次，或给 Token 补 Zone → Email Routing → Edit 权限后重跑。"
          } >> "$GITHUB_STEP_SUMMARY"
